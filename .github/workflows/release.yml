# Publishes the version declared in module.json.
name: Release Foundry Module

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "assets/**"
      - "module.json"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "source/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and validate
        run: npm run build

      - name: Assemble module
        run: |
          mkdir -p dist/rise-of-venegon
          cp module.json README.md dist/rise-of-venegon/
          cp -R packs assets dist/rise-of-venegon/
          cd dist
          zip -r rise-of-venegon.zip rise-of-venegon

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r .version module.json)"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              dist/rise-of-venegon.zip \
              module.json \
              --clobber
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            gh release create "${TAG}" \
              dist/rise-of-venegon.zip \
              module.json \
              --title "Rise of Venegon ${TAG}" \
              --generate-notes
          fi
